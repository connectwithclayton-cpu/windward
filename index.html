<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Windward, a human-in-the-loop supervision console for a deliberately myopic simulated dispatcher.">
    <title>Windward — Supervision console</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to the current decision</a>
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="Windward home">
        <span aria-hidden="true">W/</span> WINDWARD
      </a>
      <div class="shift-controls" aria-label="Shift controls">
        <span class="clock" id="shift-clock" aria-live="polite">90 sec · not started</span>
        <button class="quiet-button" id="pause-button" type="button" disabled>Pause</button>
        <button class="quiet-button" id="restart-button" type="button">Restart</button>
      </div>
    </header>
    <div id="app"></div>
    <script type="module" src="./dist/console.js"></script>
  </body>
</html>
